<!-- cadastro de usuário no sistema -->

{% extends 'base.html' %}

{% block content %}
    <h1>Criar Conta</h1>
    <form action="" method="post">
        {% csrf_token %}
        <fieldset>
            <div class="fieldset-block">
                {{ form.username.label_tag }}
                {{ form.username }}
                {{ form.username.errors }}
            </div>
            <div class="fieldset-block">
                {{ form.password.label_tag }}
                {{ form.password }}
                {{ form.password.errors }}
            </div>
        </fieldset>
        <button type="submit" id="btn-register" class="btn-main">Cadastrar</button>
        <a href="{% url 'accounts:login' %}">Já tenho uma conta</a>
    </form>
{% endblock %}
